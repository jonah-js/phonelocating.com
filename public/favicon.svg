<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" stroke="rgba(255,255,255,0.2)" stroke-width="8" fill="none" />

  <!-- Radar Grid Rings -->
  <circle cx="256" cy="256" r="180" stroke="rgba(255, 255, 255, 0.15)" stroke-width="4" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="120" stroke="rgba(255, 255, 255, 0.25)" stroke-width="4" />
  <circle cx="256" cy="256" r="60" stroke="rgba(56, 189, 248, 0.4)" stroke-width="4" />

  <!-- Radar Crosshairs -->
  <line x1="256" y1="56" x2="256" y2="456" stroke="rgba(255, 255, 255, 0.2)" stroke-width="3" />
  <line x1="56" y1="256" x2="456" y2="256" stroke="rgba(255, 255, 255, 0.2)" stroke-width="3" />

  <!-- Radar Sweep Sector -->
  <path d="M 256 256 L 383 129 A 180 180 0 0 0 256 76 Z" fill="url(#beamGrad)" />

  <!-- Satellite Target Ping (Glowing) -->
  <circle cx="340" cy="172" r="14" fill="#34d399" filter="url(#glow)" />
  <circle cx="340" cy="172" r="28" stroke="#34d399" stroke-width="3" opacity="0.6" />

  <!-- Center Locator Pin / Beacon -->
  <circle cx="256" cy="256" r="22" fill="#ffffff" filter="url(#glow)" />
  <circle cx="256" cy="256" r="10" fill="#2563eb" />
</svg>
