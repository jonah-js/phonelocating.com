<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Deep Slate Modern Squircle -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="116" stroke="#1e293b" stroke-width="8" />

  <!-- Outer Radar Track Ring -->
  <circle cx="256" cy="256" r="160" stroke="#1e293b" stroke-width="16" />

  <!-- Active Geolocation Pulse Ring -->
  <circle cx="256" cy="256" r="105" stroke="url(#primaryRing)" stroke-width="22" stroke-linecap="round" />

  <!-- 4 Cardinal Precision Reticle Ticks -->
  <line x1="256" y1="56" x2="256" y2="92" stroke="#38bdf8" stroke-width="18" stroke-linecap="round" />
  <line x1="256" y1="420" x2="256" y2="456" stroke="#38bdf8" stroke-width="18" stroke-linecap="round" />
  <line x1="56" y1="256" x2="92" y2="256" stroke="#38bdf8" stroke-width="18" stroke-linecap="round" />
  <line x1="420" y1="256" x2="456" y2="256" stroke="#38bdf8" stroke-width="18" stroke-linecap="round" />

  <!-- Satellite Signal Blip -->
  <circle cx="360" cy="152" r="18" fill="url(#accentGrad)" />

  <!-- Center Pinpoint Beacon (Crisp White + Electric Blue Core) -->
  <circle cx="256" cy="256" r="46" fill="#ffffff" />
  <circle cx="256" cy="256" r="22" fill="#2563eb" />
</svg>
